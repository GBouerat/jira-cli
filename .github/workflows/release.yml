name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: jira-aarch64-apple-darwin.tar.gz
            use_cross: false

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: jira-x86_64-apple-darwin.tar.gz
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: jira-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: jira-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: jira-x86_64-pc-windows-msvc.zip
            use_cross: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Release (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/jira"
          STAGE_DIR="stage-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "$BIN_PATH" "$STAGE_DIR/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE_DIR/"
          tar -czvf "${{ matrix.artifact_name }}" -C "$STAGE_DIR" .
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
        shell: bash

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $bin = "target/${{ matrix.target }}/release/jira.exe"
          $stage = "stage-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage
          Copy-Item $bin -Destination $stage/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE -Destination $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.artifact_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact_name }}").Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -Encoding ascii -NoNewline "${{ matrix.artifact_name }}.sha256"
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd release-artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
